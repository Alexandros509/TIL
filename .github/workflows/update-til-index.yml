name: Update TIL Index

on:
  push:
    branches: [main]
    paths:
      - "20*/**/*.md"
      - "scripts/build_til_index.py"
      - ".github/workflows/update-til-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: pip install pyyaml

      - name: Build TIL_INDEX.md
        run: python scripts/build_til_index.py

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TIL_INDEX.md
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore: update TIL_INDEX.md [skip ci]"
            git push
          fi
