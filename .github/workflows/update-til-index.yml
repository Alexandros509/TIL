name: Update TIL Index

on:
  push:
    branches: [main]
    paths:
      - "20*/**/*.md"
      - "AWS_Afterschool/**/*.md"
      - "Python_Afterschool/**/*.md"
      - "scripts/build_til_index.py"
      - ".github/workflows/update-til-index.yml"
  workflow_dispatch:

concurrency:
  group: update-til-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: pip install pyyaml

      - name: Build TIL_INDEX.md
        # Front Matter 문제는 ::warning:: 주석으로 Actions 요약에 표시된다(빌드는 실패하지 않음).
        run: python scripts/build_til_index.py

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TIL_INDEX.md
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore: update TIL_INDEX.md [skip ci]"
            # 같은 push에서 Update Image Links도 커밋할 수 있어 push 전에 최신 main 위로 올린다.
            git pull --rebase origin main
            git push
          fi
